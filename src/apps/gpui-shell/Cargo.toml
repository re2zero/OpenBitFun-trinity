[package]
name = "openbitfun-gpui-shell"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "OpenBitFun GPUI desktop shell (experimental native frontend)"

[dependencies]
gpui-kit = { workspace = true }
openbitfun-core = { path = "../../crates/assembly/core", features = [
    "i18n-runtime",
    # Embedded runtime closure, aligned with `src/apps/cli/Cargo.toml` (PLAN M3):
    # the reviewed CLI owner-feature closure plus the Code Agent atomic tool
    # owners. Do not replace with `product-full`.
    "agent-runtime",
    "product-search",
    "document-read",
    "subscription-auth",
    "remote-connect",
    "external-sources",
    "plugin-runtime",
    "opencode-plugin-host",
    "ssh-remote",
    "tools-pages",
    "tools-basic",
    "tools-git",
    "tools-mcp",
    "tools-browser-web",
    "tools-computer-use",
    "tools-image-analysis",
    "tools-agent-control",
] }
openbitfun-agent-runtime = { path = "../../crates/execution/agent-runtime", features = ["agent-runtime"] }
openbitfun-events = { path = "../../crates/contracts/events" }
openbitfun-runtime-ports = { path = "../../crates/contracts/runtime-ports", features = ["agent-api"] }
# M7 built-in terminal: PTY lifecycle from the owning services crate, VT screen
# model (grid/scrollback/alternate screen) from the emulator backend (D24).
terminal-core = { path = "../../crates/services/terminal" }
alacritty_terminal = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync"] }
uuid = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# gpui-kit's test-support forwards to gpui/gpui-platform/gpui-base/
# gpui-component test features, covering `#[gpui_kit::test]` headless windows.
gpui-kit = { workspace = true, features = ["test-support"] }
# Test fixture only (`examples/seed_session.rs` stress-test seeder): writes
# sessions through the sanctioned offline import store instead of hand-crafted
# storage files.
openbitfun-services-core = { path = "../../crates/services/services-core" }

[lints]
workspace = true
