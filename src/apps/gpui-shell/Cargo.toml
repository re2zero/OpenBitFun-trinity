[package]
name = "openbitfun-gpui-shell"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "OpenBitFun GPUI desktop shell (experimental native frontend)"

[dependencies]
gpui-kit = { workspace = true }
openbitfun-core = { path = "../../crates/assembly/core", features = [
    "i18n-runtime",
    # Embedded runtime closure, aligned with `src/apps/cli/Cargo.toml` (PLAN M3):
    # the reviewed CLI owner-feature closure plus the Code Agent atomic tool
    # owners. Do not replace with `product-full`.
    "agent-runtime",
    "product-search",
    "workspace-search",
    "document-read",
    "subscription-auth",
    "remote-connect",
    "external-sources",
    "plugin-runtime",
    "opencode-plugin-host",
    "ssh-remote",
    "tools-pages",
    "tools-basic",
    "tools-git",
    "tools-mcp",
    "tools-browser-web",
    "tools-computer-use",
    "tools-image-analysis",
    "tools-agent-control",
] }
openbitfun-agent-runtime = { path = "../../crates/execution/agent-runtime", features = ["agent-runtime"] }
openbitfun-events = { path = "../../crates/contracts/events" }
openbitfun-runtime-ports = { path = "../../crates/contracts/runtime-ports", features = [
    "agent-api",
    # M8 changes view: the workspace diff port served by the local runtime
    # services provider.
    "git-port",
] }
# M7 built-in terminal: PTY lifecycle from the owning services crate, VT screen
# model (grid/scrollback/alternate screen) from the emulator backend (D24).
terminal-core = { path = "../../crates/services/terminal" }
alacritty_terminal = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
minisign-verify = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "rt-multi-thread", "sync"] }
# M9 self-update: the release manifest and archive come over HTTPS through the
# same product-owned ring TLS provider the CLI uses, and the extracted binary is
# probed through the sanctioned child-process helper (never a bare
# `std::process::Command`). Both features are already in this crate's closure
# through `openbitfun-core`.
openbitfun-services-core = { path = "../../crates/services/services-core", features = [
    "process-runtime",
    "tls-provider",
] }
flate2 = { workspace = true }
futures-util = { workspace = true }
reqwest = { workspace = true, features = ["http2", "rustls-no-provider", "stream"] }
sha2 = { workspace = true }
tar = { workspace = true }
tempfile = { workspace = true }
uuid = { workspace = true }
# Unwrapped diff rows size to the widest line; display width (CJK = two columns)
# selects that row instead of character count.
unicode-width = { workspace = true }
# M15 files viewer: syntax highlighting for the code tab. The workspace pins
# the feature set (default syntaxes/themes, regex-onig) the CLI already ships.
syntect = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# gpui-kit's test-support forwards to gpui/gpui-platform/gpui-base/
# gpui-component test features, covering `#[gpui_kit::test]` headless windows.
gpui-kit = { workspace = true, features = ["test-support"] }
# `tests/pty_integration.rs` drives the real PTY, and `tests/update_integration.rs`
# serves the release fixture over a local HTTP/1.1 listener and runs the real
# binary as the updater.
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "time"] }

[lints]
workspace = true
