[package]
name = "openbitfun-app"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "OpenBitFun GPUI desktop shell (experimental native frontend)"

# The packaged artifact keeps the historical `openbitfun_gpui` lib name so the
# binary bootstrap, integration tests, and examples import it unchanged.
[lib]
name = "openbitfun_gpui"
path = "src/lib.rs"

[[bin]]
name = "openbitfun-app"
path = "src/main.rs"

[dependencies]
# Thin binary: the shell was split into per-concern crates under crates/ so no
# single rustc process monomorphizes the whole product (the former monolith
# peaked past the machine's memory during release codegen).
gpui-foundation = { path = "crates/gpui-foundation" }
gpui-host = { path = "crates/gpui-host" }
gpui-shell = { path = "crates/gpui-shell" }
gpui-terminal = { path = "crates/gpui-terminal" }
tokio = { workspace = true, features = ["fs", "io-util", "rt-multi-thread", "sync"] }
tracing = { workspace = true }

[dev-dependencies]
# examples/ seeders import the runtime closure types directly.
openbitfun-core = { path = "../../../src/crates/assembly/core", features = ["test-support"] }
openbitfun-services-core = { path = "../../../src/crates/services/services-core", features = [
    "process-runtime",
    "tls-provider",
] }
# gpui-kit's test-support forwards to gpui/gpui-platform/gpui-base/
# gpui-component test features, covering `#[gpui_kit::test]` headless windows.
gpui-kit = { workspace = true, features = ["test-support"] }
# Parses the compiled-in ftl catalogs in tests; the i18n:audit checks key
# parity but not Fluent grammar, and a malformed select expression only
# surfaces as a runtime registration failure.
fluent-bundle = { workspace = true }
# `tests/pty_integration.rs` drives the real PTY, and `tests/update_integration.rs`
# serves the release fixture over a local HTTP/1.1 listener and runs the real
# binary as the updater. Headless shell tests also construct terminal panes
# against a leaked tokio runtime (rt), so tab close semantics run for real.
alacritty_terminal = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
tar = { workspace = true }
serde_json = { workspace = true }
terminal-core = { path = "../../../src/crates/services/terminal" }
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "time"] }
flate2 = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
