[package]
name = "gpui-shell"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Main window shell of the OpenBitFun GPUI desktop: window chrome, session views, task board, and in-window pages"

[dependencies]
openbitfun-core = { path = "../../../../../src/crates/assembly/core", features = [
    "i18n-runtime",
    # Embedded runtime closure, aligned with `src/apps/cli/Cargo.toml` (PLAN M3):
    # the reviewed CLI owner-feature closure plus the Code Agent atomic tool
    # owners. Do not replace with `product-full`.
    "agent-runtime",
    "product-search",
    "workspace-search",
    "document-read",
    "subscription-auth",
    "remote-connect",
    "external-sources",
    "plugin-runtime",
    "opencode-plugin-host",
    "ssh-remote",
    "tools-pages",
    "tools-basic",
    "tools-git",
    "tools-mcp",
    "tools-browser-web",
    "tools-computer-use",
    "tools-image-analysis",
    "tools-agent-control",
    # G-G2: the AI commit-message generator goes through the core GitFunctionAgent.
    "function-agents",
] }
# E3 batch 5: the ACP agents page reads and writes the external-agent config
# through the core ACP client service (the same service the desktop host
# serves). Only the client role is needed here; the server role stays with the
# hosts that embed OpenBitFun as an agent.
openbitfun-acp = { path = "../../../../../src/crates/interfaces/acp", default-features = false, features = [
    "client",
] }
openbitfun-agent-runtime = { path = "../../../../../src/crates/execution/agent-runtime", features = ["agent-runtime"] }
openbitfun-core-types = { path = "../../../../../src/crates/contracts/core-types" }
openbitfun-events = { path = "../../../../../src/crates/contracts/events" }
openbitfun-product-domains = { path = "../../../../../src/crates/contracts/product-domains", features = [
    "external-sources",
] }
openbitfun-runtime-ports = { path = "../../../../../src/crates/contracts/runtime-ports", features = [
    "agent-api",
    "git-port",
] }
openbitfun-services-core = { path = "../../../../../src/crates/services/services-core", features = [
    "process-runtime",
    "tls-provider",
] }
gpui-foundation = { path = "../gpui-foundation" }
gpui-host = { path = "../gpui-host" }
gpui-terminal = { path = "../gpui-terminal" }
gpui-kit = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
# E4-b2 task board: the calendar derives future occurrences the way the web
# scene does, so the shell expands cron/at/every schedules locally instead of
# only marking the store's next-run instant.
chrono-tz = { workspace = true }
cron = { workspace = true }
futures-util = { workspace = true }
# M22 tray icon (StatusNotifierItem) and launch-at-login; auto-launch shares
# the version the desktop's tauri-plugin-autostart already pulls. `image`
# decodes the embedded brand PNG into the SNI icon pixmap.
image = { workspace = true, features = ["png"] }
ksni = { workspace = true }
auto-launch = { workspace = true }
# M15 files viewer: syntax highlighting for the code tab. The workspace pins
# the feature set (default syntaxes/themes, regex-onig) the CLI already ships.
syntect = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "rt-multi-thread", "sync"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
unicode-width = { workspace = true }
uuid = { workspace = true }
# G-SE1: the OS sleep inhibitor behind the prevent-sleep toggle; the same
# workspace version and backend the desktop host uses (logind D-Bus on Linux).
keepawake = { workspace = true }

[dev-dependencies]
# gpui-kit's test-support forwards to gpui/gpui-platform/gpui-base/
# gpui-component test features, covering `#[gpui_kit::test]` headless windows.
gpui-kit = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
