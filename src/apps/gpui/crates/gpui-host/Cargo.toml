[package]
name = "gpui-host"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Process host concerns of the OpenBitFun GPUI shell: CLI flags, self-update, sleep prevention, diagnostics, storage isolation"

[dependencies]
openbitfun-core = { path = "../../../../../src/crates/assembly/core", features = [
    "local-storage",
] }
# M9 self-update: the release manifest and archive come over HTTPS through the
# same product-owned ring TLS provider the CLI uses, and the extracted binary is
# probed through the sanctioned child-process helper (never a bare
# `std::process::Command`).
openbitfun-services-core = { path = "../../../../../src/crates/services/services-core", features = [
    "process-runtime",
    "tls-provider",
] }
anyhow = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
flate2 = { workspace = true }
futures-util = { workspace = true }
minisign-verify = { workspace = true }
reqwest = { workspace = true, features = ["http2", "rustls-no-provider", "stream"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "rt-multi-thread", "sync"] }
tracing = { workspace = true }
uuid = { workspace = true }
# Diagnostics bundle export packs session logs into the same deflate zip the
# desktop support bundles use.
zip = { workspace = true }

[lints]
workspace = true
